# Postgres для локального стенда. Порт 55432, чтобы не конфликтовать
# с боевым (46678) и со стандартным 5432.
services:
  postgres:
    image: postgres:17.5
    container_name: nexer-test-pg
    environment:
      POSTGRES_PASSWORD: test
      POSTGRES_DB: nexer_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
